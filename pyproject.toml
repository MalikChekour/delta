[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "1.0.0"
description = "Agent autonome pilote depuis Telegram (GLM-4.7-Heretic / Venice)"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6",
    "openai>=1.60",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Recherche web SANS CLE : `ddgs` atteint Bing, Yandex et Brave la ou nos propres
    # scrapers recoltaient 403 et 429 (mesure du 2026-09-10). Elle est maintenue quand les
    # moteurs changent leur balisage — ce qu'un scraper maison ne fait pas : le parseur
    # ddg_lite de ce depot rendait zero resultat depuis un simple changement de guillemets.
    "ddgs>=9.16",
    # Extraction LOCALE du contenu principal d'une page. Sur l'article Wikipedia « Safran » :
    # 52 k caracteres utiles contre 62 k de texte avec le decor par retrait de balises, et
    # sans dependre d'un service tiers.
    "trafilatura>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
hermes = "hermes.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
