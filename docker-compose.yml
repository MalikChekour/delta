services:
  hermes:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - hermes-data:/data
    # L'agent execute du code arbitraire : on lui donne un conteneur, pas l'hote.
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512

volumes:
  hermes-data:
